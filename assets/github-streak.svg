<svg width="470" height="195" viewBox="0 0 470 195" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- セグメント・数値・ランプにサイバーパンク風のネオン発光効果を与える -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 点灯中のシェブロンバー内を走る光の帯 -->
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="chev-clip">
      <polygon points="24.5,78 38.0,78 33.5,102 20.0,102"/>
      <polygon points="42.1,78 55.6,78 51.1,102 37.6,102"/>
      <polygon points="59.7,78 73.2,78 68.7,102 55.2,102"/>
      <polygon points="77.3,78 90.8,78 86.3,102 72.8,102"/>
      <polygon points="94.9,78 108.4,78 103.9,102 90.4,102"/>
      <polygon points="112.5,78 126.0,78 121.5,102 108.0,102"/>
      <polygon points="130.1,78 143.6,78 139.1,102 125.6,102"/>
      <polygon points="147.7,78 161.2,78 156.7,102 143.2,102"/>
      <polygon points="165.3,78 178.8,78 174.3,102 160.8,102"/>
      <polygon points="182.9,78 196.4,78 191.9,102 178.4,102"/>
      <polygon points="200.5,78 214.0,78 209.5,102 196.0,102"/>
      <polygon points="218.1,78 231.6,78 227.1,102 213.6,102"/>
      <polygon points="235.7,78 249.2,78 244.7,102 231.2,102"/>
      <polygon points="253.3,78 266.8,78 262.3,102 248.8,102"/>
      <polygon points="270.9,78 284.4,78 279.9,102 266.4,102"/>
      <polygon points="288.5,78 302.0,78 297.5,102 284.0,102"/>
      <polygon points="306.1,78 319.6,78 315.1,102 301.6,102"/>
      <polygon points="323.7,78 337.2,78 332.7,102 319.2,102"/>
      <polygon points="341.3,78 354.8,78 350.3,102 336.8,102"/>
      <polygon points="358.9,78 372.4,78 367.9,102 354.4,102"/>
      <polygon points="376.5,78 390.0,78 385.5,102 372.0,102"/>
      <polygon points="394.1,78 407.6,78 403.1,102 389.6,102"/>
      <polygon points="411.7,78 425.2,78 420.7,102 407.2,102"/>
      <polygon points="429.3,78 442.8,78 438.3,102 424.8,102"/>
    </clipPath>
  </defs>

  <!-- 外枠と背景（プロフィール全体と統一した右上・左下斜めカット枠） -->
  <polygon points="0.5,0.5 457.5,0.5 469.5,12.5 469.5,194.5 12.5,194.5 0.5,182.5" fill="#0d0221" stroke="#ff007f" stroke-width="1"/>

  <!-- ヘッダーと稼働ステータスランプ -->
  <text x="20" y="27" fill="#00f2fe" font-family="monospace" font-size="14" font-weight="bold">STREAK // OVERDRIVE METER</text>
  <circle cx="354.2" cy="22" r="3.2" fill="#f9f871" filter="url(#neon-glow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite" />
  </circle>
  <text x="450" y="26" fill="#f9f871" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">OVERDRIVE MAX</text>

  <!-- メイン指標（Current Streak vs Target Record） -->
  <text x="20" y="63" fill="#ff007f" font-family="monospace" font-size="20" font-weight="bold" filter="url(#neon-glow)">CURRENT: 6 DAYS</text>
  <text x="450" y="62" fill="#00f2fe" font-family="monospace" font-size="12" font-weight="bold" text-anchor="end">TARGET RECORD: 6 DAYS (100%)</text>

  <!-- 24セグメント斜めシェブロンチャージバー -->
