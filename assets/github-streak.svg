  <polygon points="147.7,78 161.2,78 156.7,102 143.2,102" fill="#00f2fe" filter="url(#neon-glow)"/>
  <polygon points="165.3,78 178.8,78 174.3,102 160.8,102" fill="#a855f7" filter="url(#neon-glow)"/>
  <polygon points="182.9,78 196.4,78 191.9,102 178.4,102" fill="#a855f7" filter="url(#neon-glow)"/>
  <polygon points="200.5,78 214.0,78 209.5,102 196.0,102" fill="#a855f7" filter="url(#neon-glow)"/>
  <polygon points="218.1,78 231.6,78 227.1,102 213.6,102" fill="#a855f7" filter="url(#neon-glow)"/>
  <polygon points="235.7,78 249.2,78 244.7,102 231.2,102" fill="#a855f7" filter="url(#neon-glow)"/>
  <polygon points="253.3,78 266.8,78 262.3,102 248.8,102" fill="#a855f7" filter="url(#neon-glow)"/>
  <polygon points="270.9,78 284.4,78 279.9,102 266.4,102" fill="#a855f7" filter="url(#neon-glow)"/>
  <polygon points="288.5,78 302.0,78 297.5,102 284.0,102" fill="#a855f7" filter="url(#neon-glow)"/>
  <polygon points="306.1,78 319.6,78 315.1,102 301.6,102" fill="#ff007f" filter="url(#neon-glow)"/>
  <polygon points="323.7,78 337.2,78 332.7,102 319.2,102" fill="#ff007f" filter="url(#neon-glow)"/>
  <polygon points="341.3,78 354.8,78 350.3,102 336.8,102" fill="#ff007f" filter="url(#neon-glow)"/>
  <polygon points="358.9,78 372.4,78 367.9,102 354.4,102" fill="#ff007f" filter="url(#neon-glow)"/>
  <polygon points="376.5,78 390.0,78 385.5,102 372.0,102" fill="#ff007f" filter="url(#neon-glow)"/>
  <polygon points="394.1,78 407.6,78 403.1,102 389.6,102" fill="#ff007f" filter="url(#neon-glow)"/>
  <polygon points="411.7,78 425.2,78 420.7,102 407.2,102" fill="#ff007f" filter="url(#neon-glow)"/>
  <polygon points="429.3,78 442.8,78 438.3,102 424.8,102" fill="#ff007f" filter="url(#neon-glow)"/>
  <!-- 点灯済みセグメントを自然な加減速で左→右へ走るエネルギーパルス -->
  <g clip-path="url(#chev-clip)">
    <rect x="-40" y="76" width="70" height="28" fill="url(#pulse-grad)">
      <animate attributeName="x" values="-40;462.4;462.4" keyTimes="0;0.58;1" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1" dur="2.2s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- 右端ゴールマーカー -->
  <line x1="450" y1="74" x2="450" y2="108" stroke="#00ffb2" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="450" y="118" fill="#00ffb2" font-family="monospace" font-size="9" font-weight="bold" text-anchor="end">BEST</text>

  <!-- 下部2サブパネル（Total Contributionsを除外しStreak情報に特化） -->
  <rect x="20" y="130" width="207" height="48" rx="4" fill="#140630" stroke="#7928ca" stroke-width="1" stroke-opacity="0.7"/>
  <text x="123.5" y="147" fill="#7928ca" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">CURRENT SPAN</text>
  <text x="123.5" y="168" fill="#e0e0e0" font-family="monospace" font-size="13.5" font-weight="bold" text-anchor="middle">Nov 23 - Nov 28</text>

  <rect x="243" y="130" width="207" height="48" rx="4" fill="#140630" stroke="#7928ca" stroke-width="1" stroke-opacity="0.7"/>
  <text x="346.5" y="147" fill="#7928ca" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">BEST: Nov 23 - Nov 28</text>
  <text x="346.5" y="168" fill="#f9f871" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle" filter="url(#neon-glow)">NEW RECORD!</text>
</svg>