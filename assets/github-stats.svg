  <text x="300.7" y="98.0" fill="#e0e0e0" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle" dominant-baseline="central">B</text>
  <text x="370.0" y="58.0" fill="#e0e0e0" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle" dominant-baseline="central">A</text>
  <text x="439.3" y="98.0" fill="#e0e0e0" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle" dominant-baseline="central">S</text>
  <text x="439.3" y="178.0" fill="#e0e0e0" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle" dominant-baseline="central">S+</text>

  <!-- 外周目盛りを自然な加減速で走査するスキャン輝線 -->
  <g transform="translate(370,138)">
    <line x1="0" y1="-63" x2="0" y2="-72" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" filter="url(#neon-glow)">
