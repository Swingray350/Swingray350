  <text x="266" y="90" fill="#00f2fe" font-family="monospace" font-size="14" font-weight="bold" text-anchor="end">27</text>
  <rect x="18" y="96" width="248" height="7" rx="3.5" fill="#2a1650" opacity="0.75"/>
  <rect x="18" y="96" width="223.2" height="7" rx="3.5" fill="#00f2fe" filter="url(#neon-glow)"/>
  <g clip-path="url(#clip-bar-1)">
