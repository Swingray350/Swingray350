<svg width="465" height="230" viewBox="0 0 465 230" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 棒グラフ・ゲージ・針にサイバーパンク風のネオン発光効果を与える -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- 扇型ゲージの低ランクから高ランクにかけてネオン色を遷移させる -->
    <linearGradient id="gauge-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <!-- バー内部を左から右へ駆け抜けるエネルギーパルス用の光の帯 -->
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip-bar-1"><rect x="18" y="96" width="223.2" height="7" rx="3.5"/></clipPath>
    <clipPath id="clip-bar-2"><rect x="18" y="128" width="8.3" height="7" rx="3.5"/></clipPath>
  </defs>

  <!-- 外枠と背景（プロフィール全体と統一した右上・左下斜めカット枠） -->
  <polygon points="0.5,0.5 452.5,0.5 464.5,12.5 464.5,229.5 12.5,229.5 0.5,217.5" fill="#0d0221" stroke="#ff007f" stroke-width="1"/>

  <!-- カードタイトル -->
  <text x="18" y="29" fill="#00f2fe" font-family="monospace" font-size="16.5" font-weight="bold">Swingray350's GitHub Stats</text>

  <!-- 左側：項目ごとの横棒グラフ -->
  <text x="18" y="58" fill="#e0e0e0" font-family="monospace" font-size="14">STARS</text>
  <text x="266" y="58" fill="#f9f871" font-family="monospace" font-size="14" font-weight="bold" text-anchor="end">0</text>
  <rect x="18" y="64" width="248" height="7" rx="3.5" fill="#2a1650" opacity="0.75"/>

  <line x1="80.0" y1="64" x2="80.0" y2="71" stroke="#0d0221" stroke-width="1" opacity="0.85"/>
  <line x1="142.0" y1="64" x2="142.0" y2="71" stroke="#0d0221" stroke-width="1" opacity="0.85"/>
