  <circle cx="370" cy="138" r="58" fill="none" stroke="url(#gauge-grad)" stroke-width="8.5" stroke-linecap="round" filter="url(#neon-glow)" stroke-dasharray="5.60 364.42" transform="rotate(150 370 138)"/>

