  <line x1="142.0" y1="160" x2="142.0" y2="167" stroke="#0d0221" stroke-width="1" opacity="0.85"/>
  <line x1="204.0" y1="160" x2="204.0" y2="167" stroke="#0d0221" stroke-width="1" opacity="0.85"/>
