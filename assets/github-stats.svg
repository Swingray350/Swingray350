  <text x="18" y="154" fill="#e0e0e0" font-family="monospace" font-size="14">ISSUES</text>
  <text x="266" y="154" fill="#a855f7" font-family="monospace" font-size="14" font-weight="bold" text-anchor="end">0</text>
