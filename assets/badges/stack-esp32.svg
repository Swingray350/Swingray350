<svg xmlns="http://www.w3.org/2000/svg" width="192" height="34" viewBox="0 0 192 34">
  <defs>
    <!-- サイバーパンクHUDタグの白文字ネオングロー -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 面取りHUDタグ本体（背景透過・#12052d面取り本体） -->
  <polygon points="0.5,0.5 184.5,0.5 191.5,7.5 191.5,33.5 7.5,33.5 0.5,26.5" fill="#12052d" stroke="#ff007f" stroke-width="1.1"/>
  <!-- 左端アクセント縦バー＆右下コーナードット -->
  <rect x="0.5" y="0.5" width="3.5" height="24" fill="#ff007f"/>
  <circle cx="186.5" cy="29.5" r="1.1" fill="#ff007f" opacity="0.7"/>

  <!-- アイコン・サービス名・区切り線 -->
  <g transform="translate(16, 17)"><rect x="-3.5" y="-3.5" width="7" height="7" rx="1" fill="none" stroke="#00f2fe" stroke-width="1.3"/><rect x="-1.3" y="-1.3" width="2.6" height="2.6" fill="#00f2fe"/><line x1="-1.5" y1="-5.5" x2="-1.5" y2="-3.5" stroke="#00f2fe" stroke-width="1.1"/><line x1="1.5" y1="-5.5" x2="1.5" y2="-3.5" stroke="#00f2fe" stroke-width="1.1"/><line x1="-1.5" y1="3.5" x2="-1.5" y2="5.5" stroke="#00f2fe" stroke-width="1.1"/><line x1="1.5" y1="3.5" x2="1.5" y2="5.5" stroke="#00f2fe" stroke-width="1.1"/><line x1="-5.5" y1="-1.5" x2="-3.5" y2="-1.5" stroke="#00f2fe" stroke-width="1.1"/><line x1="-5.5" y1="1.5" x2="-3.5" y2="1.5" stroke="#00f2fe" stroke-width="1.1"/><line x1="3.5" y1="-1.5" x2="5.5" y2="-1.5" stroke="#00f2fe" stroke-width="1.1"/><line x1="3.5" y1="1.5" x2="5.5" y2="1.5" stroke="#00f2fe" stroke-width="1.1"/></g>
  <text x="27" y="20.5" font-family="monospace" font-size="10.5" fill="#ff99cc">ESP32</text>
  <line x1="70" y1="6" x2="70" y2="28" stroke="#7928ca" stroke-width="1"/>
  <text x="131" y="20.5" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="#ffffff" filter="url(#glow)">Microcontroller</text></svg>