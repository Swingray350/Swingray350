<svg xmlns="http://www.w3.org/2000/svg" width="109" height="28" viewBox="0 0 109 28">
  <defs>
    <!-- サイバーパンクHUDタグの白文字ネオングロー -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 面取りHUDタグ本体（背景透過・#12052d面取り本体） -->
  <polygon points="0.5,0.5 102.5,0.5 108.5,6.5 108.5,27.5 6.5,27.5 0.5,21.5" fill="#12052d" stroke="#ff007f" stroke-width="1.1"/>
  <!-- 左端アクセント縦バー＆右下コーナードット -->
  <rect x="0.5" y="0.5" width="3.5" height="19" fill="#ff007f"/>
  <circle cx="103.5" cy="23.5" r="1.1" fill="#ff007f" opacity="0.7"/>

  <!-- アイコン・サービス名・区切り線 -->
  <g transform="translate(14, 14) scale(0.88)"><path d="M 0 5.5 C -3 2 -4.5 -0.5 -4.5 -2 A 4.5 4.5 0 1 1 4.5 -2 C 4.5 -0.5 3 2 0 5.5 Z" fill="none" stroke="#ff007f" stroke-width="1.3"/><circle cx="0" cy="-2" r="1.4" fill="#ff007f"/></g>
  <text x="24" y="17.2" font-family="monospace" font-size="9.5" fill="#ff99cc">Base</text>
  <line x1="57" y1="6" x2="57" y2="22" stroke="#7928ca" stroke-width="1"/>
  <text x="83" y="17.2" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="bold" fill="#ffffff" filter="url(#glow)">Japan</text></svg>