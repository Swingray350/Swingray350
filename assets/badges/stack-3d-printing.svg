<svg xmlns="http://www.w3.org/2000/svg" width="211" height="34" viewBox="0 0 211 34">
  <defs>
    <!-- サイバーパンクHUDタグの白文字ネオングロー -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 面取りHUDタグ本体（背景透過・#12052d面取り本体） -->
  <polygon points="0.5,0.5 203.5,0.5 210.5,7.5 210.5,33.5 7.5,33.5 0.5,26.5" fill="#12052d" stroke="#7928ca" stroke-width="1.1"/>
  <!-- 左端アクセント縦バー＆右下コーナードット -->
  <rect x="0.5" y="0.5" width="3.5" height="24" fill="#7928ca"/>
  <circle cx="205.5" cy="29.5" r="1.1" fill="#a855f7" opacity="0.7"/>

  <!-- アイコン・サービス名・区切り線 -->
  <g transform="translate(16, 17)"><polygon points="0,-5.5 5,-2.5 5,3 0,6 -5,3 -5,-2.5" fill="none" stroke="#00f2fe" stroke-width="1.3" stroke-linejoin="round"/><polyline points="-5,-2.5 0,0.3 5,-2.5" fill="none" stroke="#00f2fe" stroke-width="1.1"/><line x1="0" y1="0.3" x2="0" y2="6" stroke="#00f2fe" stroke-width="1.1"/></g>
  <text x="27" y="20.5" font-family="monospace" font-size="10.5" fill="#d8b4fe">3D Printing</text>
  <line x1="109" y1="6" x2="109" y2="28" stroke="#7928ca" stroke-width="1"/>
  <text x="160" y="20.5" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="#ffffff" filter="url(#glow)">Additive Mfg</text></svg>