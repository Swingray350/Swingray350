<svg xmlns="http://www.w3.org/2000/svg" width="121" height="28" viewBox="0 0 121 28">
  <defs>
    <!-- サイバーパンクHUDタグの白文字ネオングロー -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 面取りHUDタグ本体（背景透過・#12052d面取り本体） -->
  <polygon points="0.5,0.5 114.5,0.5 120.5,6.5 120.5,27.5 6.5,27.5 0.5,21.5" fill="#12052d" stroke="#ff007f" stroke-width="1.1"/>
  <!-- 左端アクセント縦バー＆右下コーナードット -->
  <rect x="0.5" y="0.5" width="3.5" height="19" fill="#ff007f"/>
  <circle cx="115.5" cy="23.5" r="1.1" fill="#ff007f" opacity="0.7"/>

  <!-- アイコン・サービス名・区切り線 -->
  <g transform="translate(14, 14) scale(0.88)"><circle cx="-3" cy="0" r="3.2" fill="none" stroke="#ff007f" stroke-width="1.4"/><circle cx="3" cy="0" r="3.2" fill="none" stroke="#ff007f" stroke-width="1.4"/><line x1="-4.2" y1="0" x2="-1.8" y2="0" stroke="#ff007f" stroke-width="1.1"/><line x1="1.8" y1="0" x2="4.2" y2="0" stroke="#ff007f" stroke-width="1.1"/><line x1="3" y1="-1.2" x2="3" y2="1.2" stroke="#ff007f" stroke-width="1.1"/></g>
  <text x="24" y="17.2" font-family="monospace" font-size="9.5" fill="#ff99cc">Arduino</text>
  <line x1="75" y1="6" x2="75" y2="22" stroke="#7928ca" stroke-width="1"/>
  <text x="98" y="17.2" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="bold" fill="#ffffff" filter="url(#glow)">Nano</text></svg>