<svg xmlns="http://www.w3.org/2000/svg" width="211" height="34" viewBox="0 0 211 34">
  <defs>
    <!-- サイバーパンクHUDタグの白文字ネオングロー -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="shine-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip-badge">
      <polygon points="0.5,0.5 203.5,0.5 210.5,7.5 210.5,33.5 7.5,33.5 0.5,26.5"/>
    </clipPath>
  </defs>

  <!-- 面取りHUDタグ本体（背景透過・#12052d面取り本体） -->
  <polygon points="0.5,0.5 203.5,0.5 210.5,7.5 210.5,33.5 7.5,33.5 0.5,26.5" fill="#12052d" stroke="#00f2fe" stroke-width="1.1"/>
  <!-- SNSボタン用の斜め光沢スキャン演出 -->
  <g clip-path="url(#clip-badge)">
    <rect x="-40" y="0" width="42" height="34" fill="url(#shine-grad)" transform="skewX(-20)">
      <animate attributeName="x" values="-40;241;241" keyTimes="0;0.38;1" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1" dur="4.2s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- 左端アクセント縦バー＆右下コーナードット -->
  <rect x="0.5" y="0.5" width="3.5" height="24" fill="#00f2fe"/>
  <circle cx="205.5" cy="29.5" r="1.1" fill="#00f2fe" opacity="0.7"/>

  <!-- アイコン・サービス名・区切り線 -->
  <g transform="translate(16, 17)"><path d="M -5 -5 L 5 5 M 5 -5 L -5 5" stroke="#00f2fe" stroke-width="1.8" stroke-linecap="round"/></g>
  <text x="27" y="20.5" font-family="monospace" font-size="10.5" fill="#8be9fd">X (Twitter)</text>
  <line x1="109" y1="6" x2="109" y2="28" stroke="#7928ca" stroke-width="1"/>
  <text x="160" y="20.5" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="#ffffff" filter="url(#glow)">@swtr350_ino</text></svg>