<svg xmlns="http://www.w3.org/2000/svg" width="139" height="28" viewBox="0 0 139 28">
  <defs>
    <!-- サイバーパンクHUDタグの白文字ネオングロー -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 面取りHUDタグ本体（背景透過・#12052d面取り本体） -->
  <polygon points="0.5,0.5 132.5,0.5 138.5,6.5 138.5,27.5 6.5,27.5 0.5,21.5" fill="#12052d" stroke="#7928ca" stroke-width="1.1"/>
  <!-- 左端アクセント縦バー＆右下コーナードット -->
  <rect x="0.5" y="0.5" width="3.5" height="19" fill="#7928ca"/>
  <circle cx="133.5" cy="23.5" r="1.1" fill="#a855f7" opacity="0.7"/>

  <!-- アイコン・サービス名・区切り線 -->
  <g transform="translate(14, 14) scale(0.88)"><polygon points="-4.5,-4.5 1.5,-4.5 4.5,-1.5 4.5,4.5 -1.5,4.5 -4.5,1.5" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-linejoin="round"/><line x1="-4.5" y1="-4.5" x2="4.5" y2="4.5" stroke="#a855f7" stroke-width="1" opacity="0.7"/><circle cx="0" cy="0" r="1.5" fill="#a855f7"/></g>
  <text x="24" y="17.2" font-family="monospace" font-size="9.5" fill="#d8b4fe">Autodesk</text>
  <line x1="81" y1="6" x2="81" y2="22" stroke="#7928ca" stroke-width="1"/>
  <text x="110" y="17.2" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="bold" fill="#ffffff" filter="url(#glow)">Fusion</text></svg>