<svg xmlns="http://www.w3.org/2000/svg" width="141" height="28" viewBox="0 0 141 28">
  <defs>
    <!-- サイバーパンクHUDタグの白文字ネオングロー -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 面取りHUDタグ本体（背景透過・#12052d面取り本体） -->
  <polygon points="0.5,0.5 134.5,0.5 140.5,6.5 140.5,27.5 6.5,27.5 0.5,21.5" fill="#12052d" stroke="#00f2fe" stroke-width="1.1"/>
  <!-- 左端アクセント縦バー＆右下コーナードット -->
  <rect x="0.5" y="0.5" width="3.5" height="19" fill="#00ffb2"/>
  <circle cx="135.5" cy="23.5" r="1.1" fill="#00f2fe" opacity="0.7"/>

  <!-- アイコン・サービス名・区切り線 -->
  <g transform="translate(14, 14) scale(0.88)"><circle cx="0" cy="0" r="5" fill="none" stroke="#00f2fe" stroke-width="1.3"/><polyline points="-3,0 -1,0 0,-2.5 1.5,2.5 2.5,0 3.5,0" fill="none" stroke="#00f2fe" stroke-width="1.1" stroke-linejoin="round"/></g>
  <text x="24" y="17.2" font-family="monospace" font-size="9.5" fill="#8be9fd">Status</text>
  <line x1="69" y1="6" x2="69" y2="22" stroke="#7928ca" stroke-width="1"/>
  <circle cx="82" cy="14" r="2.8" fill="#00ffb2" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.25;1" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="90" y="17.2" font-family="monospace" font-size="9.5" font-weight="bold" fill="#ffffff" filter="url(#glow)">ONLINE</text></svg>