<svg xmlns="http://www.w3.org/2000/svg" width="185" height="28" viewBox="0 0 185 28">
  <defs>
    <!-- サイバーパンクHUDタグの白文字ネオングロー -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 面取りHUDタグ本体（背景透過・#12052d面取り本体） -->
  <polygon points="0.5,0.5 178.5,0.5 184.5,6.5 184.5,27.5 6.5,27.5 0.5,21.5" fill="#12052d" stroke="#ff007f" stroke-width="1.1"/>
  <!-- 左端アクセント縦バー＆右下コーナードット -->
  <rect x="0.5" y="0.5" width="3.5" height="19" fill="#ff007f"/>
  <circle cx="179.5" cy="23.5" r="1.1" fill="#ff007f" opacity="0.7"/>

  <!-- アイコン・サービス名・区切り線 -->
  <g transform="translate(14, 14) scale(0.88)"><rect x="-3.5" y="-3.5" width="7" height="7" rx="1" fill="none" stroke="#ff007f" stroke-width="1.3"/><rect x="-1.3" y="-1.3" width="2.6" height="2.6" fill="#ff007f"/><line x1="-1.5" y1="-5.5" x2="-1.5" y2="-3.5" stroke="#ff007f" stroke-width="1.1"/><line x1="1.5" y1="-5.5" x2="1.5" y2="-3.5" stroke="#ff007f" stroke-width="1.1"/><line x1="-1.5" y1="3.5" x2="-1.5" y2="5.5" stroke="#ff007f" stroke-width="1.1"/><line x1="1.5" y1="3.5" x2="1.5" y2="5.5" stroke="#ff007f" stroke-width="1.1"/><line x1="-5.5" y1="-1.5" x2="-3.5" y2="-1.5" stroke="#ff007f" stroke-width="1.1"/><line x1="-5.5" y1="1.5" x2="-3.5" y2="1.5" stroke="#ff007f" stroke-width="1.1"/><line x1="3.5" y1="-1.5" x2="5.5" y2="-1.5" stroke="#ff007f" stroke-width="1.1"/><line x1="3.5" y1="1.5" x2="5.5" y2="1.5" stroke="#ff007f" stroke-width="1.1"/></g>
  <text x="24" y="17.2" font-family="monospace" font-size="9.5" fill="#ff99cc">Seeed XIAO</text>
