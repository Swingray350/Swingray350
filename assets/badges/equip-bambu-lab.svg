<svg xmlns="http://www.w3.org/2000/svg" width="163" height="28" viewBox="0 0 163 28">
  <defs>
    <!-- サイバーパンクHUDタグの白文字ネオングロー -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 面取りHUDタグ本体（背景透過・#12052d面取り本体） -->
  <polygon points="0.5,0.5 156.5,0.5 162.5,6.5 162.5,27.5 6.5,27.5 0.5,21.5" fill="#12052d" stroke="#00f2fe" stroke-width="1.1"/>
  <!-- 左端アクセント縦バー＆右下コーナードット -->
  <rect x="0.5" y="0.5" width="3.5" height="19" fill="#00f2fe"/>
  <circle cx="157.5" cy="23.5" r="1.1" fill="#00f2fe" opacity="0.7"/>

  <!-- アイコン・サービス名・区切り線 -->
  <g transform="translate(14, 14) scale(0.88)"><polygon points="0,-5.5 5,-2.5 5,3 0,6 -5,3 -5,-2.5" fill="none" stroke="#00f2fe" stroke-width="1.3" stroke-linejoin="round"/><polyline points="-5,-2.5 0,0.3 5,-2.5" fill="none" stroke="#00f2fe" stroke-width="1.1"/><line x1="0" y1="0.3" x2="0" y2="6" stroke="#00f2fe" stroke-width="1.1"/></g>
  <text x="24" y="17.2" font-family="monospace" font-size="9.5" fill="#8be9fd">Bambu Lab</text>
  <line x1="87" y1="6" x2="87" y2="22" stroke="#7928ca" stroke-width="1"/>
  <text x="125" y="17.2" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="bold" fill="#ffffff" filter="url(#glow)">X1 Carbon</text></svg>