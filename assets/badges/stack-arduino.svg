<svg xmlns="http://www.w3.org/2000/svg" width="179" height="34" viewBox="0 0 179 34">
  <defs>
    <!-- サイバーパンクHUDタグの白文字ネオングロー -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 面取りHUDタグ本体（背景透過・#12052d面取り本体） -->
  <polygon points="0.5,0.5 171.5,0.5 178.5,7.5 178.5,33.5 7.5,33.5 0.5,26.5" fill="#12052d" stroke="#00f2fe" stroke-width="1.1"/>
  <!-- 左端アクセント縦バー＆右下コーナードット -->
  <rect x="0.5" y="0.5" width="3.5" height="24" fill="#00f2fe"/>
  <circle cx="173.5" cy="29.5" r="1.1" fill="#00f2fe" opacity="0.7"/>

  <!-- アイコン・サービス名・区切り線 -->
  <g transform="translate(16, 17)"><circle cx="-3" cy="0" r="3.2" fill="none" stroke="#00f2fe" stroke-width="1.4"/><circle cx="3" cy="0" r="3.2" fill="none" stroke="#00f2fe" stroke-width="1.4"/><line x1="-4.2" y1="0" x2="-1.8" y2="0" stroke="#00f2fe" stroke-width="1.1"/><line x1="1.8" y1="0" x2="4.2" y2="0" stroke="#00f2fe" stroke-width="1.1"/><line x1="3" y1="-1.2" x2="3" y2="1.2" stroke="#00f2fe" stroke-width="1.1"/></g>
  <text x="27" y="20.5" font-family="monospace" font-size="10.5" fill="#8be9fd">Arduino</text>
  <line x1="83" y1="6" x2="83" y2="28" stroke="#7928ca" stroke-width="1"/>
  <text x="131" y="20.5" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="#ffffff" filter="url(#glow)">Prototyping</text></svg>