<svg xmlns="http://www.w3.org/2000/svg" width="198" height="34" viewBox="0 0 198 34">
  <defs>
    <!-- サイバーパンクHUDタグの白文字ネオングロー -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 面取りHUDタグ本体（背景透過・#12052d面取り本体） -->
  <polygon points="0.5,0.5 190.5,0.5 197.5,7.5 197.5,33.5 7.5,33.5 0.5,26.5" fill="#12052d" stroke="#ff007f" stroke-width="1.1"/>
  <!-- 左端アクセント縦バー＆右下コーナードット -->
  <rect x="0.5" y="0.5" width="3.5" height="24" fill="#ff007f"/>
  <circle cx="192.5" cy="29.5" r="1.1" fill="#ff007f" opacity="0.7"/>

  <!-- アイコン・サービス名・区切り線 -->
  <g transform="translate(16, 17)"><polygon points="-4.5,-4.5 1.5,-4.5 4.5,-1.5 4.5,4.5 -1.5,4.5 -4.5,1.5" fill="none" stroke="#00f2fe" stroke-width="1.2" stroke-linejoin="round"/><line x1="-4.5" y1="-4.5" x2="4.5" y2="4.5" stroke="#00f2fe" stroke-width="1" opacity="0.7"/><circle cx="0" cy="0" r="1.5" fill="#00f2fe"/></g>
  <text x="27" y="20.5" font-family="monospace" font-size="10.5" fill="#ff99cc">Autodesk Fusion</text>
  <line x1="135" y1="6" x2="135" y2="28" stroke="#7928ca" stroke-width="1"/>
  <text x="166.5" y="20.5" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="bold" fill="#ffffff" filter="url(#glow)">3D CAD</text></svg>