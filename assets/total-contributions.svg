<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="195" viewBox="0 0 300 195">
  <defs>
    <filter id="glow-cyan-4" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-pink-4" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="area-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#7928ca" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.03"/>
    </linearGradient>
    <!-- スキャナーの縦の光の帯（幅0の line だと objectBoundingBox のグラデーションが描画されないため、細い rect で描く） -->
    <linearGradient id="scan-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>
    <!-- エリアの塗りを線の描画と同期して左から表示する -->
    <clipPath id="area-reveal">
      <rect x="40" y="44" width="242" height="126">
        <animate attributeName="width" values="0;0;242;242" keyTimes="0;0.05;0.45;1" calcMode="spline" keySplines="0 0 1 1;0.45 0 0.25 1;0 0 1 1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <!-- スキャナーの帯を X 軸（y=168）で切る -->
    <clipPath id="plot-clip">
      <rect x="0" y="44" width="300" height="124"/>
    </clipPath>
  </defs>

  <!-- 外枠・背景 -->
  <rect x="0.5" y="0.5" width="299" height="194" rx="4.5" fill="#0d0221" stroke="#ff007f" stroke-width="1"/>

  <!-- ヘッダー（STREAKと色・サイズ・Y位置を統一） -->
  <text x="16" y="27" fill="#00f2fe" font-family="monospace" font-size="14" font-weight="bold">TOTAL CONTRIBUTIONS</text>

  <!-- 水平グリッド線（0〜100 を y=168〜48 に対応させる。5等分＝24px） -->
  <line x1="40" y1="48.0" x2="282" y2="48.0" stroke="#00ffb2" stroke-opacity="0.6" stroke-dasharray="6,3" stroke-width="1"/>
  <line x1="40" y1="72.0" x2="282" y2="72.0" stroke="#7928ca" stroke-opacity="0.25" stroke-dasharray="2,3" stroke-width="0.8"/>
  <line x1="40" y1="96.0" x2="282" y2="96.0" stroke="#7928ca" stroke-opacity="0.25" stroke-dasharray="2,3" stroke-width="0.8"/>
  <line x1="40" y1="120.0" x2="282" y2="120.0" stroke="#7928ca" stroke-opacity="0.25" stroke-dasharray="2,3" stroke-width="0.8"/>
  <line x1="40" y1="144.0" x2="282" y2="144.0" stroke="#7928ca" stroke-opacity="0.25" stroke-dasharray="2,3" stroke-width="0.8"/>
  <line x1="40" y1="168.0" x2="282" y2="168.0" stroke="#7928ca" stroke-opacity="0.5" stroke-width="1"/>

  <!-- 縦軸と目盛り -->
  <line x1="40" y1="48" x2="40" y2="168" stroke="#7928ca" stroke-opacity="0.5" stroke-width="1"/>
  <g stroke="#7928ca" stroke-opacity="0.6" stroke-width="1">
    <line x1="37" y1="48.0" x2="40" y2="48.0" stroke="#00ffb2" stroke-opacity="0.8"/>
    <line x1="37" y1="72.0" x2="40" y2="72.0"/>
    <line x1="37" y1="96.0" x2="40" y2="96.0"/>
    <line x1="37" y1="120.0" x2="40" y2="120.0"/>
    <line x1="37" y1="144.0" x2="40" y2="144.0"/>
    <line x1="37" y1="168.0" x2="40" y2="168.0"/>
  </g>
  <g font-family="monospace" font-size="8.5" fill="#9a8ec4" text-anchor="end">
    <text x="35" y="51.0" fill="#00ffb2" font-weight="bold">100</text>
    <text x="35" y="75.0">80</text>
    <text x="35" y="99.0">60</text>
    <text x="35" y="123.0">40</text>
    <text x="35" y="147.0">20</text>
    <text x="35" y="171.0">0</text>
  </g>

  <!-- 総数（プロット左上の空いた領域に置き、罫線と重ねる） -->
  <text x="50" y="90" font-family="monospace" font-size="38" font-weight="bold" fill="#00f2fe" filter="url(#glow-cyan-4)">31</text>
  <!-- 終点に到達した瞬間に総数が一瞬光る -->
  <text x="50" y="90" font-family="monospace" font-size="38" font-weight="bold" fill="#ffffff" opacity="0" filter="url(#glow-cyan-4)">31<animate attributeName="opacity" values="0;0;0.55;0;0" keyTimes="0;0.44;0.47;0.62;1" dur="6s" repeatCount="indefinite"/></text>

  <!-- 次のチェックポイント（GOAL 100）：未達成なので中空のダイヤを点滅させる -->
  <rect x="-4" y="-4" width="8" height="8" transform="translate(280 48) rotate(45)" fill="#0d0221" stroke="#00ffb2" stroke-width="1.3">
    <animate attributeName="opacity" values="1;0.3;1" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <text x="270" y="43" text-anchor="end" font-family="monospace" font-size="10.5" font-weight="bold" fill="#00ffb2">NEXT 100 // 69 LEFT</text>

  <!-- チャートレイヤー（周期の終わりにまとめてフェードアウトし、空の状態から再描画することで継ぎ目なくループさせる） -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.82;0.95;1" calcMode="spline" keySplines="0 0 1 1;0.42 0 0.58 1;0 0 1 1" dur="6s" repeatCount="indefinite"/>

    <!-- 累積エリアの塗り -->
    <path d="M 40.0 168.0 C 53.3 164.8, 66.7 159.6, 80.0 158.4 C 93.3 157.2, 106.7 157.2, 120.0 157.2 C 133.3 157.2, 146.7 157.2, 160.0 157.2 C 173.3 157.2, 186.7 135.6, 200.0 134.4 C 213.3 133.2, 226.7 133.4, 240.0 133.2 C 253.3 133.0, 266.7 131.6, 280.0 130.8 L 280.0 168.0 L 40.0 168.0 Z" fill="url(#area-grad)" clip-path="url(#area-reveal)"/>

    <!-- 累積カーブ（dasharray のギャップを120にするのは、offset=101 のときに次の dash が終端に現れないようにするため） -->
    <path id="curve-line" d="M 40.0 168.0 C 53.3 164.8, 66.7 159.6, 80.0 158.4 C 93.3 157.2, 106.7 157.2, 120.0 157.2 C 133.3 157.2, 146.7 157.2, 160.0 157.2 C 173.3 157.2, 186.7 135.6, 200.0 134.4 C 213.3 133.2, 226.7 133.4, 240.0 133.2 C 253.3 133.0, 266.7 131.6, 280.0 130.8" fill="none" stroke="#ff007f" stroke-width="2" stroke-linecap="round" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="101;101;0;0" keyTimes="0;0.05;0.45;1" calcMode="spline" keySplines="0 0 1 1;0.45 0 0.25 1;0 0 1 1" dur="6s" repeatCount="indefinite"/>
    </path>


    <!-- 終点から次のチェックポイントへの点線（到達後に表示） -->
    <line x1="280" y1="124.5" x2="280" y2="54.0" stroke="#00ffb2" stroke-width="1" stroke-dasharray="1.5,2" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0.9" keyTimes="0;0.48;0.55;1" dur="6s" repeatCount="indefinite"/>
    </line>

    <!-- 到達時の波紋リング -->
    <circle cx="280" cy="130.8" r="3.5" fill="none" stroke="#ff007f" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="3.5;3.5;16;16" keyTimes="0;0.45;0.66;1" calcMode="spline" keySplines="0 0 1 1;0.2 0.6 0.35 1;0 0 1 1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.9;0;0" keyTimes="0;0.44;0.46;0.66;1" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- 最新地点（終点）のドット：到達後に表示して呼吸させる -->
    <g opacity="1">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.44;0.47;1" dur="6s" repeatCount="indefinite"/>
      <circle cx="280" cy="130.8" r="7" fill="#ff007f" opacity="0.35">
        <animate attributeName="r" values="4;9;4" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.1;0.6" keyTimes="0;0.5;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="280" cy="130.8" r="3.5" fill="#ff007f" stroke="#ffffff" stroke-width="1" filter="url(#glow-pink-4)"/>
    </g>
  </g>

  <!-- 描画中の線の先端を追うスキャナーヘッド（親 g の clip は静止座標なので、帯は常に X 軸で切れる） -->
  <g clip-path="url(#plot-clip)">
    <g opacity="0">
      <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.05;0.45;1" calcMode="spline" keySplines="0 0 1 1;0.45 0 0.25 1;0 0 1 1">
        <mpath xlink:href="#curve-line"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.04;0.07;0.43;0.47;1" dur="6s" repeatCount="indefinite"/>
      <rect x="-0.6" y="0" width="1.2" height="122" fill="url(#scan-grad)"/>
      <circle r="5.5" fill="#00f2fe" opacity="0.3"/>
      <circle r="2.8" fill="#ffffff" stroke="#00f2fe" stroke-width="1.2" filter="url(#glow-cyan-4)"/>
    </g>
  </g>

  <!-- 下部軸ラベル -->
  <text x="40" y="182" font-family="monospace" font-size="9.5" fill="#9a8ec4">2026/11/23</text>
  <text x="175" y="182" text-anchor="middle" font-family="monospace" font-size="9" fill="#7928ca">CUMULATIVE GROWTH</text>
  <text x="282" y="182" text-anchor="end" font-family="monospace" font-size="9.5" font-weight="bold" fill="#00f2fe">NOW</text>
</svg>
