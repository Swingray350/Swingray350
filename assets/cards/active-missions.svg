<svg xmlns="http://www.w3.org/2000/svg" width="520" height="114" viewBox="0 0 520 114">
  <defs>
    <filter id="glow-mission" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="accent-bar-mission" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
  </defs>

  <!-- 面取りHUDパネル本体（背景透過） -->
  <polygon points="0.5,0.5 509.5,0.5 519.5,10.5 519.5,113.5 10.5,113.5 0.5,103.5" fill="#0d0221" stroke="#ff007f" stroke-opacity="0.8" stroke-width="1"/>
  <rect x="0.5" y="0.5" width="4" height="102" fill="url(#accent-bar-mission)"/>
  <circle cx="513.5" cy="107.5" r="1.2" fill="#ff007f" opacity="0.7"/>

  <!-- 右上ステータス小ラベル -->
  <text x="504" y="18" text-anchor="end" font-family="monospace" font-size="8.5" font-weight="bold" fill="#00ffb2" opacity="0.85">3 ACTIVE // IN_PROGRESS</text>

  <!-- 行間破線 -->
  <line x1="18" y1="51" x2="504" y2="51" stroke="#7928ca" stroke-opacity="0.28" stroke-dasharray="2,3" stroke-width="0.9"/>
  <line x1="18" y1="82" x2="504" y2="82" stroke="#7928ca" stroke-opacity="0.28" stroke-dasharray="2,3" stroke-width="0.9"/>

  <!-- ミッション01 -->
  <rect x="-3" y="-3" width="6" height="6" transform="translate(22 36) rotate(45)" fill="#00f2fe" filter="url(#glow-mission)">
    <animate attributeName="opacity" values="1;0.3;1" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="2.4s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <text x="34" y="40" font-family="monospace" font-size="10" font-weight="bold" fill="#7928ca">01</text>
  <text x="56" y="40" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">Motorized Pen Holder</text>
  <rect x="410" y="26.5" width="94" height="19" rx="3" fill="#19093d" stroke="#00f2fe" stroke-opacity="0.65" stroke-width="0.9"/>
  <text x="457" y="39" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="bold" fill="#00f2fe">XIAO ESP32C6</text>

  <!-- ミッション02 -->
  <rect x="-3" y="-3" width="6" height="6" transform="translate(22 67) rotate(45)" fill="#ff007f" filter="url(#glow-mission)">
    <animate attributeName="opacity" values="1;0.3;1" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
  </rect>
  <text x="34" y="71" font-family="monospace" font-size="10" font-weight="bold" fill="#7928ca">02</text>
  <text x="56" y="71" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">Neon Sign</text>
  <rect x="332" y="57.5" width="172" height="19" rx="3" fill="#19093d" stroke="#ff5ca8" stroke-opacity="0.65" stroke-width="0.9"/>
  <text x="418" y="70" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="bold" fill="#ff5ca8">Filament LEDs &amp; I2S Audio</text>

  <!-- ミッション03 -->
  <rect x="-3" y="-3" width="6" height="6" transform="translate(22 98) rotate(45)" fill="#00ffb2" filter="url(#glow-mission)">
    <animate attributeName="opacity" values="1;0.3;1" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
  <text x="34" y="102" font-family="monospace" font-size="10" font-weight="bold" fill="#7928ca">03</text>
  <text x="56" y="102" font-family="monospace" font-size="12" font-weight="bold" fill="#ffffff">Smart Desk Light</text>
  <rect x="352" y="88.5" width="152" height="19" rx="3" fill="#19093d" stroke="#00ffb2" stroke-opacity="0.65" stroke-width="0.9"/>
  <text x="428" y="101" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="bold" fill="#00ffb2">mmWave Presence Sensor</text>
</svg>