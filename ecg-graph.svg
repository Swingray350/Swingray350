<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="200" fill="#0d0221" rx="10"/>
  
  <!-- テキスト（タイトルと軸ラベル） -->
  <text x="60" y="30" fill="#00f2fe" font-family="monospace" font-size="16" font-weight="bold">Contribution Graph</text>
  <text x="20" y="100" fill="#7928ca" font-family="monospace" font-size="12" transform="rotate(-90 20,100)" text-anchor="middle">Contributions</text>
  <text x="405" y="185" fill="#7928ca" font-family="monospace" font-size="12" text-anchor="middle">Days</text>

  <!-- 軸線・グリッド線 -->
  <line x1="60" y1="150" x2="750" y2="150" stroke="#7928ca" stroke-width="1" opacity="0.8"/> <!-- X軸のベースライン -->
  <line x1="60" y1="50" x2="60" y2="150" stroke="#7928ca" stroke-width="1" opacity="0.8"/>  <!-- Y軸のベースライン -->
  <line x1="60" y1="50" x2="750" y2="50" stroke="#7928ca" stroke-width="1" opacity="0.3" stroke-dasharray="4 4"/> <!-- 上部の点線 -->

  <!-- 薄く常に表示される全体波形（ゴースト） -->
  <path d="M 60.0,148.75 L 71.5,148.75 L 83.0,148.75 L 94.5,148.75 L 106.0,148.75 L 117.5,148.75 L 129.0,148.75 L 140.5,148.75 L 152.0,148.75 L 163.5,148.75 L 175.0,148.75 L 186.5,148.75 L 198.0,148.75 L 209.5,148.75 L 221.0,148.75 L 232.5,148.75 L 244.0,148.75 L 255.5,148.75 L 267.0,148.75 L 278.5,148.75 L 290.0,148.75 L 301.5,148.75 L 313.0,148.75 L 324.5,148.75 L 336.0,148.75 L 347.5,148.75 L 359.0,148.75 L 370.5,148.75 L 382.0,148.75 L 393.5,148.75 L 405.0,148.75 L 416.50000000000006,148.75 L 428.0,148.75 L 439.50000000000006,148.75 L 451.0,148.75 L 462.5,148.75 L 474.0,148.75 L 485.5,148.75 L 497.0,148.75 L 508.5,148.75 L 520.0,148.75 L 531.5,148.75 L 543.0,148.75 L 554.5,148.75 L 566.0,148.75 L 577.5,148.75 L 589.0,148.75 L 600.5,148.75 L 612.0,148.75 L 623.5,148.75 L 635.0,148.75 L 646.5,148.75 L 658.0,148.75 L 669.5,148.75 L 681.0,148.75 L 692.5,148.75 L 704.0,148.75 L 715.5,112.5 L 727.0,87.5 L 738.5,137.5 L 750.0,50.0" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.2"/>

  <!-- 左端から描画され、完成したら消えてループするネオンライン -->
  <path d="M 60.0,148.75 L 71.5,148.75 L 83.0,148.75 L 94.5,148.75 L 106.0,148.75 L 117.5,148.75 L 129.0,148.75 L 140.5,148.75 L 152.0,148.75 L 163.5,148.75 L 175.0,148.75 L 186.5,148.75 L 198.0,148.75 L 209.5,148.75 L 221.0,148.75 L 232.5,148.75 L 244.0,148.75 L 255.5,148.75 L 267.0,148.75 L 278.5,148.75 L 290.0,148.75 L 301.5,148.75 L 313.0,148.75 L 324.5,148.75 L 336.0,148.75 L 347.5,148.75 L 359.0,148.75 L 370.5,148.75 L 382.0,148.75 L 393.5,148.75 L 405.0,148.75 L 416.50000000000006,148.75 L 428.0,148.75 L 439.50000000000006,148.75 L 451.0,148.75 L 462.5,148.75 L 474.0,148.75 L 485.5,148.75 L 497.0,148.75 L 508.5,148.75 L 520.0,148.75 L 531.5,148.75 L 543.0,148.75 L 554.5,148.75 L 566.0,148.75 L 577.5,148.75 L 589.0,148.75 L 600.5,148.75 L 612.0,148.75 L 623.5,148.75 L 635.0,148.75 L 646.5,148.75 L 658.0,148.75 L 669.5,148.75 L 681.0,148.75 L 692.5,148.75 L 704.0,148.75 L 715.5,112.5 L 727.0,87.5 L 738.5,137.5 L 750.0,50.0" fill="none" stroke="#ff007f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2000" stroke-dashoffset="2000">
    <!-- values="2000;0;0" と keyTimes="0;0.8;1" で、最後の20%（1秒間）は完成状態で停止する演出 -->
    <animate attributeName="stroke-dashoffset" values="2000;0;0" keyTimes="0;0.8;1" dur="5s" repeatCount="indefinite" />
  </path>
</svg>
