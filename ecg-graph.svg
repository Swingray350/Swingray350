<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="200" fill="#0d0221" rx="10"/>
  
  <!-- テキスト（タイトルと軸ラベル） -->
  <text x="60" y="30" fill="#00f2fe" font-family="monospace" font-size="16" font-weight="bold">Contribution Graph</text>
  <text x="20" y="100" fill="#7928ca" font-family="monospace" font-size="12" transform="rotate(-90 20,100)" text-anchor="middle">Contributions</text>
  <text x="405" y="185" fill="#7928ca" font-family="monospace" font-size="12" text-anchor="middle">Days</text>

  <!-- 軸線・グリッド線 -->
  <line x1="60" y1="150" x2="750" y2="150" stroke="#7928ca" stroke-width="1" opacity="0.8"/> <!-- X軸のベースライン -->
  <line x1="60" y1="50" x2="60" y2="150" stroke="#7928ca" stroke-width="1" opacity="0.8"/>  <!-- Y軸のベースライン -->
  <line x1="60" y1="50" x2="750" y2="50" stroke="#7928ca" stroke-width="1" opacity="0.3" stroke-dasharray="4 4"/> <!-- 上部の点線 -->

  <!-- 縦軸・横軸の目盛りとラベル -->
  <line x1="55" y1="150.0" x2="60" y2="150.0" stroke="#7928ca" stroke-width="1"/>
  <text x="50" y="153.0" fill="#7928ca" font-family="monospace" font-size="10" text-anchor="end">0</text>
  <line x1="55" y1="110.0" x2="60" y2="110.0" stroke="#7928ca" stroke-width="1"/>
  <text x="50" y="113.0" fill="#7928ca" font-family="monospace" font-size="10" text-anchor="end">4</text>
  <line x1="55" y1="70.0" x2="60" y2="70.0" stroke="#7928ca" stroke-width="1"/>
  <text x="50" y="73.0" fill="#7928ca" font-family="monospace" font-size="10" text-anchor="end">8</text>
  <line x1="55" y1="50.0" x2="60" y2="50.0" stroke="#7928ca" stroke-width="1"/>
  <text x="50" y="53.0" fill="#7928ca" font-family="monospace" font-size="10" text-anchor="end">10</text>
  
  <line x1="60.0" y1="150" x2="60.0" y2="155" stroke="#7928ca" stroke-width="1"/>
  <text x="60.0" y="170" fill="#7928ca" font-family="monospace" font-size="10" text-anchor="middle">-60d</text>
  <line x1="232.5" y1="150" x2="232.5" y2="155" stroke="#7928ca" stroke-width="1"/>
  <text x="232.5" y="170" fill="#7928ca" font-family="monospace" font-size="10" text-anchor="middle">-45d</text>
  <line x1="405.0" y1="150" x2="405.0" y2="155" stroke="#7928ca" stroke-width="1"/>
  <text x="405.0" y="170" fill="#7928ca" font-family="monospace" font-size="10" text-anchor="middle">-30d</text>
  <line x1="577.5" y1="150" x2="577.5" y2="155" stroke="#7928ca" stroke-width="1"/>
  <text x="577.5" y="170" fill="#7928ca" font-family="monospace" font-size="10" text-anchor="middle">-15d</text>
  <line x1="750.0" y1="150" x2="750.0" y2="155" stroke="#7928ca" stroke-width="1"/>
  <text x="750.0" y="170" fill="#7928ca" font-family="monospace" font-size="10" text-anchor="middle">Today</text>
  

